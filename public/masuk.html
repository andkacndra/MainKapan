<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MainKapan |Masuk</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="split">
        <aside class="auth-art"><a class="brand" href="/" style="color:white">MainKapan</a>
            <h1>Main lebih mudah.</h1>
            <p>Pesan lapangan dalam beberapa langkah sederhana.</p>
            <ul>
                <li>Jadwal lapangan terkini</li>
                <li>Booking cepat dan aman</li>
                <li>Kelola reservasi Anda</li>
            </ul>
        </aside>
        <section class="auth-main">
            <div class="form-card"><a class="brand" href="/">MainKapan</a>
                <h1>Selamat datang</h1>
                <p class="muted">Masuk untuk melanjutkan pesanan Anda.</p>
                <div class="alert"></div>
                <form id="login">
                    <div class="field"><label for="email">Email</label>
                        <div class="input-wrap"><input autofocus id="email" type="email"
                                name="email" autocomplete="email" required></div>
                    </div>
                    <div class="field"><label for="password">Password</label>
                        <div class="input-wrap"><input id="password" type="password"
                                name="password" autocomplete="current-password" required><button type="button"
                                class="password-toggle">Tampilkan</button></div>
                    </div><button type="submit" class="btn" style="width:100%">Masuk</button>
                </form>
                <p class="muted">Belum punya akun? <a href="/daftar.html"
                        style="color:#16a34a;font-weight:700">Daftar</a></p>
            </div>
        </section>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/auth-page.js"></script>
</body>

</html>
