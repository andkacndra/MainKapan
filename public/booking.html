<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MainKapan</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav class="nav container"><a class="brand" href="/">MainKapan</a>
        <div class="navlinks"><a href="/">Lapangan</a><a href="/reservasi-saya.html">Reservasi Saya</a></div>
        <div class="actions" id="nav-user"></div>
    </nav>
    <main class="page container booking-layout">
        <div class="stepper"><span class="step active">1 Pilih Jadwal</span><span class="step" id="st2">2 Data
                Pemesan</span><span class="step" id="st3">3 Konfirmasi</span></div>
        <section id="step1">
            <p class="small">PILIH LAPANGAN</p>
            <h1 id="court-name">Memuat...</h1>
            <h3>Pilih tanggal</h3>
            <div class="dates" id="dates"></div>
            <h3>Pilih jam</h3>
            <div class="legend"><span><i class="dot"></i> Tersedia</span><span><i class="dot"
                        style="background:#e2e8f0"></i> Terisi</span><span><i class="dot"
                        style="background:#16a34a"></i> Dipilih</span></div>
            <div class="slots" id="slots"></div>
            <div class="summarybar" id="sum"></div>
        </section>
        <section id="step2" hidden>
            <div class="form-card">
                <h1>Data pemesan</h1>
                <p class="muted">Pastikan nomor WhatsApp bisa dihubungi.</p>
                <form id="customer-form">
                    <div class="field"><label for="name">Nama lengkap</label><input id="name" name="name" required>
                    </div>
                    <div class="field"><label for="whatsapp">Nomor WhatsApp</label><input id="whatsapp" name="whatsapp"
                            required></div>
                    <div class="field"><label for="note">Catatan (opsional)</label><textarea id="note" name="note"
                            rows="3"></textarea></div><button class="btn" type="submit">Lanjut ke konfirmasi</button>
                </form>
            </div>
        </section>
        <section id="step3" hidden>
            <div class="form-card">
                <h1>Konfirmasi pesanan</h1>
                <div id="confirm-detail"></div><button id="confirm" class="btn">Konfirmasi Pesanan</button>
            </div>
        </section>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/booking.js"></script>
</body>

</html>
